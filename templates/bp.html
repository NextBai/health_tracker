{% extends "base.html" %}

{% block extra_head %}
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% endblock %}

{% block content %}
<div class="grid">
    <div class="card">
        <h2 style="color: var(--primary-color);">新增血壓紀錄</h2>
        <form id="bp-form">
            <div class="form-group">
                <label>收縮壓 (Systolic, mmHg)</label>
                <input type="number" id="systolic" class="form-control" required>
            </div>
            <div class="form-group">
                <label>舒張壓 (Diastolic, mmHg)</label>
                <input type="number" id="diastolic" class="form-control" required>
            </div>
            <div class="form-group">
                <label>心率 (Heart Rate, bpm)</label>
                <input type="number" id="heart_rate" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">儲存紀錄</button>
        </form>
    </div>

    <div class="card">
        <h2 style="color: var(--primary-color);">歷史趨勢</h2>
        <canvas id="bpChart" width="400" height="300"></canvas>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/bp.js') }}"></script>
{% endblock %}
