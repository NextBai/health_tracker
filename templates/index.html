{% extends "base.html" %}

{% block content %}
<div class="grid">
    <a href="{{ url_for('posture') }}" style="text-decoration: none; color: inherit;">
        <div class="card">
            <h2 style="color: var(--primary-color);">動態姿勢偵測</h2>
            <p>透過 AI 視覺辨識即時分析您的體態，偵測高低肩、駝背、骨盆傾斜等 7 項指標。</p>
        </div>
    </a>
    
    <a href="{{ url_for('bp_tracker') }}" style="text-decoration: none; color: inherit;">
        <div class="card">
            <h2 style="color: var(--primary-color);">血壓紀錄追蹤</h2>
            <p>紀錄與追蹤您的收縮壓、舒張壓及心率變化，提供視覺化趨勢分析。</p>
        </div>
    </a>
</div>

<div class="card" style="margin-top: 2rem;">
    <h2>AI 綜合健康建議</h2>
    <p>結合您的姿勢紀錄、血壓趨勢與個人資料，提供專屬的健康改善方案。</p>
    <button id="btn-get-advice" class="btn btn-primary" style="margin-top: 1rem;">獲取最新建議</button>
    <div id="ai-advice-container">
        <div id="ai-advice-content" style="white-space: pre-wrap; line-height: 1.6;"></div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.getElementById('btn-get-advice').addEventListener('click', () => {
    const container = document.getElementById('ai-advice-container');
    const content = document.getElementById('ai-advice-content');
    const btn = document.getElementById('btn-get-advice');
    
    btn.textContent = '分析中...';
    btn.disabled = true;
    container.style.display = 'block';
    content.innerHTML = '<em>連線中...</em>';
    
    const source = new EventSource('/api/ai_advice_stream');
    
    source.onmessage = (e) => {
        if (e.data === '[DONE]') {
            source.close();
            btn.textContent = '重新獲取建議';
            btn.disabled = false;
            return;
        }
        
        try {
            const data = JSON.parse(e.data);
            if (data.error) {
                content.textContent += '\n\n獲取建議失敗: ' + data.error;
                source.close();
                btn.textContent = '重新獲取建議';
                btn.disabled = false;
            } else if (data.status) {
                if (!content.textContent || content.querySelector('em')) {
                    content.innerHTML = `<em>${data.status}</em>`;
                }
            } else if (data.text) {
                if (content.querySelector('em')) {
                    content.textContent = '';
                }
                content.textContent += data.text;
            }
        } catch(err) {
            console.error('Parse error:', err);
        }
    };
    
    source.onerror = (e) => {
        source.close();
        content.textContent += '\n\n網路連線中斷或授權失敗，請確認登入狀態並重試。';
        btn.textContent = '重新獲取建議';
        btn.disabled = false;
    };
});
</script>
{% endblock %}
