<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthTracker | AI Health Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <h1><a href="{{ url_for('index') }}" style="color:inherit; text-decoration:none;">HealthTracker</a></h1>
        <nav class="nav-links">
            {% if session.get('user_id') %}
                <a href="{{ url_for('posture') }}">姿勢偵測</a>
                <a href="{{ url_for('bp_tracker') }}">血壓紀錄</a>
                <a href="{{ url_for('auth.logout') }}">登出 ({{ session.get('username') }})</a>
            {% else %}
                <a href="{{ url_for('auth.login') }}">登入</a>
                <a href="{{ url_for('auth.register') }}">註冊</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
